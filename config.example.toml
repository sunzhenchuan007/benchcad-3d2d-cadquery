# Pass an explicitly selected file with --config. No automatic config/login reads.
# The key is read only from OPENAI_API_KEY in the controller environment.
[api]
protocol = "responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = ""
max_output_tokens = 8192
# reasoning_effort = "high"

[budget]
rounds = 30
wall_seconds = 1800
execution_seconds = 300
max_transport_failures = 3

[executor]
backend = "docker"
image = "benchcad-cadquery:local"
memory_mib = 4096
cpus = 1
pids = 128
log_bytes = 8388608

[evaluation]
# Set once to enable automatic scoring and reporting after --reconstruct.
# Use the pinned upstream checkout described in evaluation/README.md.
# iou_vendor = "/path/to/benchcad-2-main"
evaluator_image = "benchcad-cadquery:evaluator"
evaluation_seconds = 300
# reference_step is only needed for standalone reconstruct/evaluate commands.
